<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ariel Elias Games</title>
<style>
  :root { --bg: #e8f2f8; --card: #ffffff; --text: #10233b; --muted: #4e6279; --accent: #1f6feb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1622; --card: #18222f; --text: #eef3f8; --muted: #a3b3c5; --accent: #6ea8ff; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 18px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 40px 16px; }
  .card { background: var(--card); border-radius: 20px; padding: 24px; }
  h1 { margin: 0 0 16px; font-size: 32px; }
  h2 { margin: 0; font-size: 24px; }
  p { margin: 6px 0; color: var(--muted); }
  a { color: var(--accent); font-weight: 700; }
  ul { padding-left: 20px; }
</style>
</head>
<body>
<main>
  <h1>Ariel Elias Games</h1>
  <div class="card">
    <h2>Blockquake: Big Block Puzzle</h2>
    <p>Chain combos, battle bosses and take on Block Quest: a colorful block puzzle with big, easy-to-see blocks and a new challenge every day.</p>
    <ul>
      <!-- Uncomment once the iPhone version is out:

      -->
      <li><a href="https://play.google.com/store/apps/details?id=com.blockbreeze">Get it on Google Play</a></li>
      <li><a href="block-breeze/privacy-policy.html">Privacy policy</a></li>
      <li>Support: <a href="mailto:deafuntblind@outlook.com">deafuntblind@outlook.com</a></li>
    </ul>
  </div>
</main>
</body>
</html>
